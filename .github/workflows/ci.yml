name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet-build:
    name: Build .NET solution
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.203'

      - name: Restore
        run: dotnet restore dotnet/SmartHome.slnx

      - name: Build
        run: dotnet build dotnet/SmartHome.slnx --no-restore --configuration Release

  dotnet-test:
    name: Test .NET solution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.203'

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore dotnet/SmartHome.slnx

      - name: Build
        run: dotnet build dotnet/SmartHome.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test dotnet/SmartHome.slnx --no-build --no-restore --configuration Release --logger "console;verbosity=detailed"

  postgres-migrator:
    name: PostgreSQL and migrations
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      Mqtt__Credentials__Username: ci-client
      Mqtt__Credentials__Password: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI Compose environment from example
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Verify PostgreSQL accepts a query
        run: >-
          docker compose exec -T postgres sh -ec
          'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1;"'

      - name: Run database migrations
        run: docker compose run --build --rm db-migrator

      - name: Verify at least one migration was applied
        run: |
          count="$(docker compose exec -T postgres sh -ec '
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
              -c "SELECT COUNT(*) FROM \"__EFMigrationsHistory\";"
          ')"
          if [[ ! "$count" =~ ^[0-9]+$ ]] || (( count < 1 )); then
            echo "Expected at least one applied EF Core migration; found: ${count:-empty}" >&2
            exit 1
          fi
          echo "Applied EF Core migrations: $count"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs postgres db-migrator

      - name: Clean up
        if: always()
        run: docker compose down --volumes

  mosquitto:
    name: Mosquitto TLS
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      Mqtt__Credentials__Username: ci-client
      Mqtt__Credentials__Password: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI Compose environment from example
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate temporary Mosquitto TLS credentials
        run: | 
          bash .github/scripts/generate-ci-mqtt-certificates.sh
        
          chmod -R a+rwX infrastructure/mosquitto/config \
            infrastructure/mosquitto/data infrastructure/mosquitto/log

      - name: Create temporary Mosquitto password file
        run: >-
          docker compose run --rm --user mosquitto --entrypoint mosquitto_passwd mosquitto
          -b -c /mosquitto/config/passwd "$Mqtt__Credentials__Username" "$Mqtt__Credentials__Password"

      - name: Start Mosquitto
        run: docker compose up -d --wait mosquitto

      - name: Install Mosquitto client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients

      - name: Verify Mosquitto TLS publish and subscribe
        run: |
          set -euo pipefail
          published=false
          for attempt in {1..10}; do
            if mosquitto_pub \
              -h 127.0.0.1 -p 8883 \
              --cafile infrastructure/mosquitto/certificates/ca/ca.crt \
              --cert infrastructure/mosquitto/certificates/client/client.crt \
              --key infrastructure/mosquitto/certificates/client/client.key \
              -u "$Mqtt__Credentials__Username" -P "$Mqtt__Credentials__Password" \
              -r -t ci/health -m ci-smoke-ok; then
              published=true
              break
            fi
            sleep 1
          done
          if [[ "$published" != true ]]; then
            echo "Could not publish to the Mosquitto broker after 10 attempts." >&2
            exit 1
          fi
          message="$(mosquitto_sub \
            -h 127.0.0.1 -p 8883 \
            --cafile infrastructure/mosquitto/certificates/ca/ca.crt \
            --cert infrastructure/mosquitto/certificates/client/client.crt \
            --key infrastructure/mosquitto/certificates/client/client.key \
            -u "$Mqtt__Credentials__Username" -P "$Mqtt__Credentials__Password" \
            -t ci/health -C 1 -W 10)"
          test "$message" = 'ci-smoke-ok'

      - name: Show broker logs on failure
        if: failure()
        run: |
          docker compose logs mosquitto
          if [ -f infrastructure/mosquitto/log/mosquitto.log ]; then
            sudo cat infrastructure/mosquitto/log/mosquitto.log
          fi

      - name: Clean up
        if: always()
        run: docker compose down --volumes

  telemetry-worker:
    name: Telemetry Worker test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      Mqtt__Credentials__Username: ci-client
      Mqtt__Credentials__Password: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create CI Compose environment from example
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Generate temporary MQTT TLS credentials
        run: |
          bash .github/scripts/generate-ci-mqtt-certificates.sh

          chmod -R a+rwX infrastructure/mosquitto/config \
            infrastructure/mosquitto/data infrastructure/mosquitto/log

      - name: Copy client certificates for Worker
        run: |
          mkdir -p dotnet/src/SmartHome.TelemetryWorker/certificates
          cp infrastructure/mosquitto/certificates/ca/ca.crt \
            dotnet/src/SmartHome.TelemetryWorker/certificates/ca.crt
          cp infrastructure/mosquitto/certificates/client/client.crt \
            dotnet/src/SmartHome.TelemetryWorker/certificates/client.crt
          cp infrastructure/mosquitto/certificates/client/client.key \
            dotnet/src/SmartHome.TelemetryWorker/certificates/client.key

      - name: Create temporary Mosquitto password file
        run: |
          docker compose run --rm --user mosquitto --entrypoint mosquitto_passwd mosquitto \
            -b -c /mosquitto/config/passwd "$Mqtt__Credentials__Username" "$Mqtt__Credentials__Password"

      - name: Start PostgreSQL and Mosquitto
        run: docker compose up -d --wait postgres mosquitto

      - name: Install Mosquitto client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto-clients

      - name: Build Worker and migrator images
        run: docker compose build telemetry-worker db-migrator

      - name: Run database migrations
        run: docker compose run --rm --no-deps db-migrator

      - name: Start Telemetry Worker
        run: docker compose up -d --wait --no-deps telemetry-worker

      - name: Verify Worker handles a climate message
        run: |
          set -euo pipefail

          connected=false
          for attempt in {1..30}; do
            logs="$(docker compose logs --no-color telemetry-worker)"
            if grep -Fq 'Connected and subscribed to MQTT.' <<< "$logs"; then
              connected=true
              break
            fi
            sleep 2
          done
          if [[ "$connected" != true ]]; then
            echo "Worker did not connect and subscribe." >&2
            docker compose logs telemetry-worker
            exit 1
          fi

          mosquitto_pub \
            -h 127.0.0.1 -p 8883 \
            --cafile infrastructure/mosquitto/certificates/ca/ca.crt \
            --cert infrastructure/mosquitto/certificates/client/client.crt \
            --key infrastructure/mosquitto/certificates/client/client.key \
            -u "$Mqtt__Credentials__Username" -P "$Mqtt__Credentials__Password" \
            -t 'smarthome/devices/11111111-1111-1111-1111-111111111111/sensors/22222222-2222-2222-2222-222222222222/telemetry/climate' \
            -m '{"sourceMessageId":1,"measuredAtUtc":"2026-11-17T00:00:00Z","temperatureCelsius":21.5,"relativeHumidityPercent":48.25}'

          handled=false
          for attempt in {1..30}; do
            logs="$(docker compose logs --no-color telemetry-worker)"
            if grep -Fq 'Reason: SensorNotFound' <<< "$logs"; then
              handled=true
              break
            fi
            sleep 2
          done
          if [[ "$handled" != true ]]; then
            echo "Worker did not handle the climate message." >&2
            docker compose logs telemetry-worker
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs postgres db-migrator mosquitto telemetry-worker
          if [ -f infrastructure/mosquitto/log/mosquitto.log ]; then
            sudo cat infrastructure/mosquitto/log/mosquitto.log
          fi

      - name: Clean up
        if: always()
        run: docker compose down --volumes
