name: smarthome

services:
  postgres:
    image: postgres:18
    container_name: smarthome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthome_postgres}
      POSTGRES_USER: ${POSTGRES_USER:-smarthome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrator:
    container_name: smarthome-db-migrator
    build:
      context: ./dotnet
      dockerfile: src/SmartHome.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__SmartHome: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-smarthome_postgres};Username=${POSTGRES_USER:-smarthome};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smarthome-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"    # MQTTS (secure)
    volumes:
      - ./infrastructure/mosquitto/config:/mosquitto/config
      - ./infrastructure/mosquitto/certificates:/mosquitto/certificates:ro
      - ./infrastructure/mosquitto/data:/mosquitto/data
      - ./infrastructure/mosquitto/log:/mosquitto/log

volumes:
  postgres_data:
